name: 'Pest Tests'

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    # Without this a hanging browser test runs into GitHub's 6h default.
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      CACHE_STORE: array
      BROADCAST_CONNECTION: log
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
          extensions: intl, zip, sodium, pcntl, bcmath, pdo_mysql
          coverage: none

      - name: Install ffmpeg
        # ThumbnailServiceTest shells out to ffmpeg to generate sample clips —
        # the binary needs to be on PATH or those tests fail.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install npm dependencies
        # Skip Playwright's postinstall browser download here; we install only
        # the chromium variant we actually need a few steps later.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        # The pest-plugin-browser drives Playwright; --with-deps grabs the
        # system libs Chromium needs on the runner.
        run: npx playwright install --with-deps chromium

      - name: Copy .env
        # Must run before the asset build: Vite inlines VITE_* variables at
        # build time. Without them Echo is built with an undefined wsHost and
        # keeps retrying a connection that never resolves, which hangs every
        # browser test that loads the Inertia app.
        run: cp .env.example .env

      - name: Build frontend assets
        # The report blades pull Tailwind via @vite(); without a build manifest
        # the browser tests fail to render the page.
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Pest
        run: ./vendor/bin/pest
